  <head>

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Physics Lab" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js"></script>
    <title>Physics Structure Lab — 物理を考える研究室</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主な機能">
        <a href="#" class="brand" id="brand-home">
          <span class="brand-mark" aria-hidden="true">φ</span>
          <span><strong>Physics<br />Structure Lab</strong><small>物理を考える研究室</small></span>
        </a>
        <div class="sidebar-label">LEARNING SPACE</div>
        <nav id="nav" class="nav">
          <button data-page="overview" class="nav-link active"><span>⌂</span> ホーム</button>
          <button data-page="phenomenon" class="nav-link"><span>◉</span> 現象と定義</button>
          <button data-page="acceleration" class="nav-link"><span>↗</span> 加速度の概念</button>
          <button data-page="mechanics" class="nav-link"><span>▤</span> 力学12章</button>
          <button data-page="forcelab" class="nav-link"><span>↔</span> 力と作用図</button>
          <button data-page="conservation" class="nav-link"><span>⚖</span> 保存則研究室</button>
          <button data-page="advanced" class="nav-link"><span>◌</span> 回転・振動・軌道</button>
          <button data-page="analytical" class="nav-link"><span>∂</span> 解析力学</button>
          <button data-page="kinematics" class="nav-link"><span>↗</span> 投射・滑車</button>
          <button data-page="derivation" class="nav-link"><span>∑</span> 公式の導出</button>
          <button data-page="lab" class="nav-link"><span>◎</span> 動的実験</button>
          <button data-page="exam" class="nav-link"><span>◇</span> 出題構造研究</button>
          <button data-page="reflection" class="nav-link"><span>✎</span> 思考ノート</button>
          <button data-page="history" class="nav-link"><span>◷</span> 科学史（任意）</button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span> AIを使わず学べます
          <small id="offline-status" role="status" aria-live="polite">オフライン教材を確認中…</small>
          <small>v0.1 — 力学・運動の記述</small>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button mobile-only" aria-label="メニューを開く" aria-expanded="false">☰</button>
          <span class="breadcrumb">PHYSICS <span>/</span> 力学 <span>/</span> 運動の記述</span>
          <div class="topbar-right"><span class="edition">デジタル教科書 β</span><span class="avatar">PS</span></div>
        </header>
        <main id="app-content" tabindex="-1"></main>
        <footer class="site-footer">Physics Structure Lab · 現象を問い、定義をつくり、世界を理解する。</footer>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
    <script>
      (() => {
        const status = document.getElementById('offline-status');
        const setStatus = (message) => { if (status) status.textContent = message; };
        if (!('serviceWorker' in navigator)) {
          setStatus('このブラウザではオフライン保存に対応していません');
          return;
        }
        const monitor = () => {
          if (!navigator.onLine) {
            setStatus(navigator.serviceWorker.controller ? '● オフライン学習中（端末内に保存）' : 'オフライン：事前の保存が必要です');
          } else if (navigator.serviceWorker.controller) {
            setStatus('✓ 教材・数式を端末に保存済み');
          } else {
            setStatus('教材を端末へ保存しています…');
          }
        };
        window.addEventListener('online', monitor);
        window.addEventListener('offline', monitor);
        navigator.serviceWorker.addEventListener('controllerchange', monitor);
        navigator.serviceWorker.register('./sw.js').then(async () => {
          await navigator.serviceWorker.ready;
          // On the very first visit the controller may activate after initial page load.
          monitor();
        }).catch(error => {
          console.warn('Offline initialization failed:', error);
          setStatus('オフライン保存未完了：オンラインで再読み込みしてください');
        });
        monitor();
      })();
    </script>

  </body>
</html>
