name: Physics Lab tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics-structure-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for f in main.js physics.js definition-lab.js acceleration-lab.js mechanics-data.js mechanics-lab.js; do
            node --check "$f"
          done
      - name: Run physics and mechanics unit tests
        run: npm test
