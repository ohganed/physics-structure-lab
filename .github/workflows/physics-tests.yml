name: Physics Lab tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics-structure-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for f in main.js physics.js definition-lab.js acceleration-lab.js mechanics-data.js mechanics-lab.js mechanics-deep-part1.js mechanics-deep-part2.js mechanics-deep.js mechanics-practice-part1.js mechanics-practice-part2.js mechanics-synthesis.js mechanics-practice-core.js mechanics-practice.js force-model.js force-lab.js conservation-model.js conservation-lab.js advanced-mechanics-model.js advanced-mechanics-lab.js analytical-lab.js kinematics-extensions.js kinematics-lab.js language.js english-pages.js mechanics-en.js knowledge-connections-data.js knowledge-connections.js knowledge-journeys-core.js knowledge-journeys.js transfer-cases.js transfer-models.js transfer-lab.js inquiry-core.js inquiry-lab.js inquiry-evidence.js inquiry-method-prompts.js; do
            node --check "$f"
          done
      - name: Run physics and mechanics unit tests
        run: npm test
